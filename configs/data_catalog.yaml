    description: "National Institute of Diabetes and Digestive and Kidney Diseases patient cohort tracking female metabolic traits."
    clinical_relevance: "Standard benchmark for glucose and insulin resistance screening."

  sklearn_diabetes:
    id: "DS-003"
    name: "Scikit-Learn Diabetes Progression Benchmark (Efron et al. 2004)"
    source_url: "https://www4.stat.ncsu.edu/~boos/var.select/diabetes.html"
