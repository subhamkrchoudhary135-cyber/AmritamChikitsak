  pima_diabetes:
    id: "DS-002"
    name: "Pima Indians Diabetes Database (NIDDK)"
    source_url: "https://www.kaggle.com/datasets/uciml/pima-indians-diabetes-database"
    mirror_url: "https://raw.githubusercontent.com/jbrownlee/Datasets/master/pima-indians-diabetes.data.csv"
