    clinical_relevance: "Gold standard for 10-year multi-variable cardiovascular risk score algorithms."

  nhanes_subset:
    id: "DS-005"
    name: "CDC NHANES Cardiometabolic Examination Cohort Subset"
    source_url: "https://wwwn.cdc.gov/nchs/nhanes/"
